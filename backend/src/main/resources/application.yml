server:
  port: 8080
spring:
  application:
    name: konstruxio-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/konstruxio}
    username: ${POSTGRES_USER:konstruxio}
    password: ${POSTGRES_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-random-secret-at-least-32-characters-long}
    expiration-minutes: 720
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  media:
    base-url: ${MEDIA_SERVICE_URL:http://localhost:8090}
  ai:
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    provider: ${AI_PROVIDER:ollama}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:llama3.2:3b}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
