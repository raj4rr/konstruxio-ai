<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ductGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Ceiling Background -->
  <rect width="600" height="400" fill="#1e293b" />

  <!-- Concrete floor slab above -->
  <rect width="600" height="60" fill="#334155" stroke="#475569" stroke-width="2" />

  <!-- Drop Rods / Unistrut Hangers -->
  <line x1="120" y1="60" x2="120" y2="280" stroke="#94a3b8" stroke-width="4" />
  <line x1="480" y1="60" x2="480" y2="280" stroke="#94a3b8" stroke-width="4" />

  <!-- Large HVAC Supply Duct (Horizontal) -->
  <rect x="40" y="140" width="520" height="130" fill="url(#ductGrad)" stroke="#475569" stroke-width="3" />
  <line x1="40" y1="180" x2="560" y2="180" stroke="#f1f5f9" stroke-width="2" opacity="0.5" />

  <!-- Electrical Cable Tray (Colliding Vertically) -->
  <g transform="translate(260, 90)">
    <rect x="0" y="0" width="80" height="230" fill="url(#trayGrad)" stroke="#b45309" stroke-width="2" />
    <!-- Tray Rungs -->
    <line x1="0" y1="30" x2="80" y2="30" stroke="#78350f" stroke-width="3" />
    <line x1="0" y1="60" x2="80" y2="60" stroke="#78350f" stroke-width="3" />
    <line x1="0" y1="90" x2="80" y2="90" stroke="#78350f" stroke-width="3" />
    <line x1="0" y1="120" x2="80" y2="120" stroke="#78350f" stroke-width="3" />
    <line x1="0" y1="150" x2="80" y2="150" stroke="#78350f" stroke-width="3" />
    <line x1="0" y1="180" x2="80" y2="180" stroke="#78350f" stroke-width="3" />
  </g>

  <!-- Clash Highlight Zone -->
  <ellipse cx="300" cy="190" rx="65" ry="45" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="6,4" />

  <!-- Inspection Tag -->
  <rect x="20" y="325" width="290" height="55" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="35" y="347" fill="#f97316" font-family="monospace" font-size="12" font-weight="bold">CLASH: DUCT &amp; CABLE TRAY</text>
  <text x="35" y="365" fill="#f8fafc" font-family="monospace" font-size="11">GRID C-4 | TRADE: ELECTRICAL / HVAC</text>
</svg>
