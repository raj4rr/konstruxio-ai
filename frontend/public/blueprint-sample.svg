<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f4e79" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2a669f" stroke-width="1" stroke-opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Blueprint Background -->
  <rect width="1000" height="700" fill="#0d2b45"/>
  <rect width="1000" height="700" fill="url(#grid)"/>
  <rect width="1000" height="700" fill="url(#majorGrid)"/>

  <!-- Border & Title Block -->
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#64b5f6" stroke-width="2"/>
  <rect x="680" y="580" width="295" height="95" fill="#113659" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="700" y="610" fill="#90caf9" font-family="monospace" font-size="12" font-weight="bold">PROJECT: KONSTRUXIO TOWER</text>
  <text x="700" y="630" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">LEVEL 2 — ARCHITECTURAL PLAN</text>
  <text x="700" y="650" fill="#90caf9" font-family="monospace" font-size="11">SCALE: 1:100 | SHEET: A-201</text>

  <!-- Exterior Walls -->
  <rect x="80" y="70" width="840" height="490" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Interior Rooms & Partitions -->
  <!-- Stairwell B -->
  <rect x="80" y="70" width="160" height="150" fill="#143e64" stroke="#ffffff" stroke-width="3"/>
  <text x="110" y="145" fill="#e3f2fd" font-family="sans-serif" font-size="14" font-weight="bold">STAIRWELL B</text>
  <line x1="85" y1="100" x2="235" y2="100" stroke="#64b5f6" stroke-dasharray="4,4"/>
  <line x1="85" y1="120" x2="235" y2="120" stroke="#64b5f6" stroke-dasharray="4,4"/>
  <line x1="85" y1="160" x2="235" y2="160" stroke="#64b5f6" stroke-dasharray="4,4"/>
  <line x1="85" y1="180" x2="235" y2="180" stroke="#64b5f6" stroke-dasharray="4,4"/>

  <!-- Elevator Shaft -->
  <rect x="240" y="70" width="120" height="150" fill="#184875" stroke="#ffffff" stroke-width="3"/>
  <line x1="240" y1="70" x2="360" y2="220" stroke="#ff8a80" stroke-width="1.5"/>
  <line x1="360" y1="70" x2="240" y2="220" stroke="#ff8a80" stroke-width="1.5"/>
  <text x="252" y="150" fill="#ffebee" font-family="sans-serif" font-size="12" font-weight="bold">ELEVATOR SHAFT</text>

  <!-- Electrical & IT Room -->
  <rect x="80" y="220" width="280" height="140" fill="#113659" stroke="#ffffff" stroke-width="3"/>
  <text x="135" y="295" fill="#e3f2fd" font-family="sans-serif" font-size="13" font-weight="bold">ELECTRICAL / IT RISER</text>

  <!-- Restrooms -->
  <rect x="80" y="360" width="280" height="200" fill="#113659" stroke="#ffffff" stroke-width="3"/>
  <line x1="220" y1="360" x2="220" y2="560" stroke="#ffffff" stroke-width="2"/>
  <text x="115" y="465" fill="#e3f2fd" font-family="sans-serif" font-size="12" font-weight="bold">RESTROOM (M)</text>
  <text x="250" y="465" fill="#e3f2fd" font-family="sans-serif" font-size="12" font-weight="bold">RESTROOM (W)</text>

  <!-- Central Corridor -->
  <rect x="360" y="220" width="380" height="140" fill="#0b243a" stroke="#64b5f6" stroke-dasharray="6,6" stroke-width="1.5"/>
  <text x="475" y="295" fill="#90caf9" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="3">MAIN CORRIDOR</text>

  <!-- Conference Room A -->
  <rect x="360" y="70" width="380" height="150" fill="#113659" stroke="#ffffff" stroke-width="3"/>
  <rect x="440" y="120" width="220" height="50" rx="10" fill="#194c7a" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="470" y="150" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">CONF ROOM A</text>

  <!-- Office Suites 201 - 204 -->
  <rect x="740" y="70" width="180" height="150" fill="#113659" stroke="#ffffff" stroke-width="3"/>
  <text x="780" y="150" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">OFFICE 201</text>

  <rect x="740" y="220" width="180" height="170" fill="#113659" stroke="#ffffff" stroke-width="3"/>
  <text x="780" y="310" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">OFFICE 202</text>

  <rect x="740" y="390" width="180" height="170" fill="#113659" stroke="#ffffff" stroke-width="3"/>
  <text x="780" y="480" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">OFFICE 203</text>

  <!-- Open Workstation Bay -->
  <rect x="360" y="360" width="380" height="200" fill="#113659" stroke="#ffffff" stroke-width="3"/>
  <text x="470" y="465" fill="#e3f2fd" font-family="sans-serif" font-size="14" font-weight="bold">OPEN OFFICE COLLAB BAY</text>

  <!-- Door Swings -->
  <path d="M 400 220 A 40 40 0 0 1 440 220" fill="none" stroke="#81d4fa" stroke-width="2"/>
  <path d="M 740 250 A 40 40 0 0 0 740 290" fill="none" stroke="#81d4fa" stroke-width="2"/>
  <path d="M 740 420 A 40 40 0 0 0 740 460" fill="none" stroke="#81d4fa" stroke-width="2"/>
  <path d="M 360 250 A 40 40 0 0 1 360 290" fill="none" stroke="#81d4fa" stroke-width="2"/>

  <!-- Compass / North Arrow -->
  <g transform="translate(900, 100)">
    <circle cx="0" cy="0" r="22" fill="#113659" stroke="#64b5f6" stroke-width="1.5"/>
    <polygon points="0,-18 6,2 0,-3 -6,2" fill="#ef5350"/>
    <polygon points="0,18 6,-2 0,3 -6,-2" fill="#90caf9"/>
    <text x="-4" y="-23" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">N</text>
  </g>
</svg>
