<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Drywall wall background -->
  <rect width="600" height="400" fill="#e2e8f0" />

  <!-- Floor line -->
  <rect x="0" y="320" width="600" height="80" fill="#94a3b8" />
  <line x1="0" y1="320" x2="600" y2="320" stroke="#475569" stroke-width="3" />

  <!-- Steel Door Frame Buck (Vertical Jam) -->
  <rect x="180" y="40" width="55" height="280" fill="#334155" stroke="#1e293b" stroke-width="2" />
  <rect x="235" y="40" width="20" height="280" fill="#475569" />

  <!-- Damaged / Bent Buck at Base -->
  <path d="M 180 250 L 165 315 L 220 318 L 235 250 Z" fill="#475569" stroke="#eab308" stroke-width="3" />

  <!-- Crumpled metal crease lines -->
  <line x1="170" y1="280" x2="200" y2="295" stroke="#0f172a" stroke-width="3" />
  <line x1="180" y1="295" x2="215" y2="305" stroke="#0f172a" stroke-width="2" />

  <!-- Yellow Defect Highlight Circle -->
  <circle cx="195" cy="285" r="50" fill="none" stroke="#eab308" stroke-width="3.5" stroke-dasharray="6,4" />

  <!-- Inspection Tag -->
  <rect x="20" y="325" width="280" height="55" rx="6" fill="#000000" fill-opacity="0.8" />
  <text x="35" y="347" fill="#eab308" font-family="monospace" font-size="12" font-weight="bold">DEFECT: BENT DOOR BUCK</text>
  <text x="35" y="365" fill="#f8fafc" font-family="monospace" font-size="11">OFFICE 201 | TRADE: FINISHES</text>
</svg>
