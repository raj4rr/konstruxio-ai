<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Concrete wall background -->
  <rect width="600" height="400" fill="url(#wallGrad)" />

  <!-- Concrete texture specs -->
  <circle cx="120" cy="80" r="4" fill="#1e293b" opacity="0.4" />
  <circle cx="480" cy="320" r="6" fill="#1e293b" opacity="0.3" />
  <circle cx="280" cy="70" r="3" fill="#1e293b" opacity="0.5" />
  <line x1="180" y1="20" x2="220" y2="80" stroke="#1e293b" stroke-width="1.5" opacity="0.3" />

  <!-- Wall penetration hole -->
  <ellipse cx="300" cy="200" rx="110" ry="110" fill="#0f172a" stroke="#ef4444" stroke-width="4" stroke-dasharray="8,6" />

  <!-- PVC Pipe passing through hole -->
  <rect x="235" y="0" width="130" height="400" fill="url(#pipeGrad)" stroke="#475569" stroke-width="2" />
  <line x1="300" y1="0" x2="300" y2="400" stroke="#cbd5e1" stroke-width="2" />

  <!-- Unsealed air gap around pipe -->
  <path d="M 235 150 A 110 110 0 0 1 365 150" fill="none" stroke="#dc2626" stroke-width="5" />
  <path d="M 235 250 A 110 110 0 0 0 365 250" fill="none" stroke="#dc2626" stroke-width="5" />

  <!-- Warning indicator overlay -->
  <g transform="translate(420, 70)">
    <polygon points="0,-24 24,20 -24,20" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">!</text>
  </g>

  <!-- Inspection Metadata Watermark -->
  <rect x="20" y="325" width="280" height="55" rx="6" fill="#000000" fill-opacity="0.75" />
  <text x="35" y="347" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold">DEFECT: UNSEALED FIRESTOP</text>
  <text x="35" y="365" fill="#f8fafc" font-family="monospace" font-size="11">LOC: ELEVATOR SHAFT L2 | TRADE: SAFETY</text>
</svg>
