<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="concreteDeck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="puddle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <!-- Slab Deck Background -->
  <rect width="600" height="400" fill="url(#concreteDeck)" />

  <!-- Expansion joint line -->
  <line x1="0" y1="180" x2="600" y2="180" stroke="#334155" stroke-width="4" stroke-dasharray="20,10" />

  <!-- Standing Water Puddle -->
  <ellipse cx="320" cy="220" rx="190" ry="90" fill="url(#puddle)" stroke="#38bdf8" stroke-width="2" />
  <!-- Water ripples -->
  <ellipse cx="300" cy="210" rx="100" ry="40" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6" />
  <ellipse cx="330" cy="230" rx="60" ry="25" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8" />

  <!-- Perimeter Parapet Wall Edge -->
  <rect x="0" y="0" width="600" height="50" fill="#334155" stroke="#1e293b" stroke-width="2" />
  <rect x="250" y="15" width="100" height="20" rx="4" fill="#0f172a" />
  <text x="300" y="29" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">SCUPPER DRAIN (BLOCKED)</text>

  <!-- Inspection Tag -->
  <rect x="20" y="325" width="280" height="55" rx="6" fill="#000000" fill-opacity="0.8" />
  <text x="35" y="347" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">DEFECT: WATER PONDING</text>
  <text x="35" y="365" fill="#f8fafc" font-family="monospace" font-size="11">LEVEL 3 BALCONY | TRADE: STRUCTURAL</text>
</svg>
